name: Apply portfolio performance patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/perf-optimize.yml"
      - "scripts/perf_patch.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply performance patch
        run: python scripts/perf_patch.py

      - name: Commit optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Skills.js src/components/Experience.js src/pages/about.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "perf: optimize about skills and experience on mobile"
            git push
          fi
